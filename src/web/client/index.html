<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="assets/system.css" />
  <link rel="stylesheet" href="assets/layout.css" />
</head>

<body>
  <header>
    <div class="menu-bar" id="header-content">
      <div id="left-header-items">
        <ul role="menu-bar">
          <li role="menu-item" tabindex="0" aria-haspopup="true" class="padded-menu-item" id="system-menu">
            <strong>BorisMUD</strong>
            <ul role="menu">
              <li role="menu-item"><a id="help-link" href="#" onclick="this.blur()">Help</a></li>
              <li role="menu-item"><a href="https://orangetide.gitlab.io/boris/">About</a></li>
            </ul>
          </li>
        </ul>
      </div>
      <div id="right-header-items">
        <ul role="menu-bar">
          <li role="menu-item" tabindex="0">
            <a href="https://gitlab.com/OrangeTide/boris">GitLab</a>
          </li>
        </ul>
      </div>
    </div>
  </header>
  <main id="main-container">
    <section id="game-container">
      <div id="game-view"></div>
      <div id="game-input-container">
        <span for="game-input" class="input-prompt">
          <input type="text" id="game-input" />
        </span>
      </div>
    </section>
    <aside id="game-sidepanel">
      <div id="status-pane"></div>
      <div id="map-pane"></div>
    </aside>
  </main>

  <script>
    var sid = '', connected = false,
        view = document.getElementById('game-view'),
        inp = document.getElementById('game-input'),
        pending = null;

    inp.focus();

    function appendLine(text, color) {
      var p = document.createElement('p');
      p.textContent = text;
      if (color) p.style.color = color;
      view.appendChild(p);
      p.scrollIntoView();
    }

    function appendOutput(text, color) {
      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var part = lines[i];
        var hasMore = i < lines.length - 1;
        if (pending) {
          pending.textContent += part;
          if (hasMore) {
            pending.scrollIntoView();
            pending = null;
          }
        } else if (hasMore) {
          appendLine(part, color);
        } else if (part.length > 0) {
          pending = document.createElement('p');
          pending.textContent = part;
          if (color) pending.style.color = color;
          view.appendChild(pending);
          pending.scrollIntoView();
        }
      }
    }

    var src = new EventSource('/events');

    src.onmessage = function(e) {
      var c = e.data.charAt(0), s = e.data.substring(1);

      if (c >= 'A' && c <= 'Z') {
        /* server commands */
        if (c === 'I') {
          sid = s;
        } else {
          console.error('unknown server command: ' + c);
        }
      } else if (c === '+') {
        /* input enabled */
        connected = true;
        inp.disabled = false;
        inp.focus();
      } else if (c === '-') {
        /* input disabled */
        inp.disabled = true;
      } else if (c === '=') {
        /* status line (ignored for now) */
      } else if (c === '!') {
        /* alert */
        appendLine(s, 'red');
      } else if (c === '^') {
        /* reload */
        location.reload();
      } else if (c === '_') {
        /* idle/ticket -- ignore */
        console.log('tick', s);
      } else if (c >= '0' && c <= '9') {
        /* status line updates -- ignore for now */
      } else if (c >= 'a' && c <= 'z') {
        /* terminal messages */
        appendOutput(s);
      } else {
        appendOutput(e.data);
      }
    };

    src.onerror = function() {
      if (connected) {
        pending = null;
        appendLine('-- connection lost --', '#888');
        connected = false;
        inp.disabled = true;
      }
    };

    document.getElementById('game-input').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var text = inp.value.trim();
      if (!text || !sid) return;
      inp.value = '';
      fetch('/cmd', { method: 'POST', body: sid + ' ' + text });
    });

    document.getElementById('help-link').addEventListener('click', function(e) {
      e.preventDefault();
      appendLine('BorisMUD web client -- type commands at the prompt.', 'yellow');
    });
  </script>
</body>

</html>
