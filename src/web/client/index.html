<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="assets/system.css" />
  <link rel="stylesheet" href="assets/layout.css" />
</head>

<body>
  <header>
    <div class="menu-bar" id="header-content">
      <div id="left-header-items">
        <ul role="menu-bar">
          <li role="menu-item" tabindex="0" aria-haspopup="true" class="padded-menu-item" id="system-menu">
            <strong>BorisMUD</strong>
            <ul role="menu">
              <li role="menu-item"><a id="help-link" href="#" onclick="this.blur()">Help</a></li>
              <li role="menu-item"><a href="https://orangetide.gitlab.io/boris/">About</a></li>
            </ul>
          </li>
        </ul>
      </div>
      <div id="right-header-items">
        <ul role="menu-bar">
          <li role="menu-item" tabindex="0">
            <a href="https://gitlab.com/OrangeTide/boris">GitLab</a>
          </li>
        </ul>
      </div>
    </div>
  </header>

  <div id="login">
    <form id="login-form">
      <div class="login-title" id="login-title">LOGIN</div>
      <div id="login-error"></div>
      <div class="login-row"><label for="f-name">User:</label><input id="f-name" type="text" autocomplete="username" /></div>
      <div class="login-row"><label for="f-pw">Pass:</label><input id="f-pw" type="password" autocomplete="current-password" /></div>
      <div class="login-row" id="invite-row" style="display:none">
        <label>Code:</label>
        <input class="code-box" id="f-c1" maxlength="4" autocomplete="off" />-<input class="code-box" id="f-c2" maxlength="4" autocomplete="off" />-<input class="code-box" id="f-c3" maxlength="4" autocomplete="off" />
      </div>
      <div class="login-buttons"><button type="submit" id="btn-go">CONNECT</button></div>
      <div id="mode-toggle">need an account? click here</div>
    </form>
  </div>

  <main id="main-container" style="display:none">
    <section id="game-container">
      <div id="game-view"></div>
      <div id="game-input-container">
        <span for="game-input" class="input-prompt">
          <input type="text" id="game-input" disabled />
        </span>
      </div>
    </section>
    <aside id="game-sidepanel">
      <div id="status-pane"></div>
      <div id="map-pane"></div>
    </aside>
  </main>

  <script>
    var sid = '', connected = false, loggedIn = false,
        view = document.getElementById('game-view'),
        inp = document.getElementById('game-input'),
        login = document.getElementById('login'),
        main = document.getElementById('main-container'),
        pending = null,
        cmdHist = [],
        histIdx = -1,
        createMode = false;

    var fName = document.getElementById('f-name');
    var fPw = document.getElementById('f-pw');
    var fC1 = document.getElementById('f-c1');
    var fC2 = document.getElementById('f-c2');
    var fC3 = document.getElementById('f-c3');
    var loginError = document.getElementById('login-error');
    var loginTitle = document.getElementById('login-title');
    var inviteRow = document.getElementById('invite-row');
    var btnGo = document.getElementById('btn-go');
    var modeToggle = document.getElementById('mode-toggle');

    fName.focus();

    /* auto-advance invite code boxes */
    [fC1, fC2, fC3].forEach(function(box, i, arr) {
      box.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
        if (this.value.length >= 4 && i < arr.length - 1)
          arr[i + 1].focus();
      });
    });

    /* parse invite code from URL: /invite/XXXX-XXXX-XXXX */
    (function() {
      var m = location.pathname.match(/^\/invite\/([A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4})$/i);
      if (m) {
        var parts = m[1].toUpperCase().split('-');
        fC1.value = parts[0];
        fC2.value = parts[1];
        fC3.value = parts[2];
        createMode = true;
        loginTitle.textContent = 'CREATE ACCOUNT';
        inviteRow.style.display = '';
        btnGo.textContent = 'CREATE';
        modeToggle.textContent = 'have an account? click here';
      }
    })();

    function getCode() {
      return (fC1.value + '-' + fC2.value + '-' + fC3.value).toUpperCase();
    }

    modeToggle.addEventListener('click', function() {
      createMode = !createMode;
      if (createMode) {
        loginTitle.textContent = 'CREATE ACCOUNT';
        inviteRow.style.display = '';
        btnGo.textContent = 'CREATE';
        modeToggle.textContent = 'have an account? click here';
      } else {
        loginTitle.textContent = 'LOGIN';
        inviteRow.style.display = 'none';
        btnGo.textContent = 'CONNECT';
        modeToggle.textContent = 'need an account? click here';
      }
      loginError.textContent = '';
    });

    document.getElementById('login-form').onsubmit = function(e) {
      e.preventDefault();
      var name = fName.value.trim(), pw = fPw.value;
      if (!name || !pw || !sid) return;
      loginError.textContent = '';
      if (createMode) {
        var code = getCode();
        fetch('/cmd', { method: 'POST', body: sid + ' create ' + name + ' ' + pw + ' ' + code });
      } else {
        fetch('/cmd', { method: 'POST', body: sid + ' connect ' + name + ' ' + pw });
      }
    };

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    var pal16 = ['#000','#c00','#0a0','#aa0','#00c','#a0a','#0aa','#ccc',
                 '#555','#f55','#5f5','#ff5','#55f','#f5f','#5ff','#fff'];

    function palRgb(n) {
      if (n < 16) return pal16[n];
      if (n >= 232) { var v = (n - 232) * 10 + 8; return 'rgb('+v+','+v+','+v+')'; }
      n -= 16;
      var r = n/36|0, g = (n%36)/6|0, b = n%6;
      return 'rgb('+(r?r*40+55:0)+','+(g?g*40+55:0)+','+(b?b*40+55:0)+')';
    }

    function ansi2html(s) {
      var out = '', i = 0, fg = null, bg = null, bold = false, italic = false, ul = 0;
      function mkSpan() {
        var st = [];
        if (fg) st.push('color:'+fg);
        if (bg) st.push('background:'+bg);
        if (bold) st.push('font-weight:bold');
        if (italic) st.push('font-style:italic');
        if (ul) st.push('text-decoration:underline'+(ul===3?';text-decoration-style:wavy':''));
        return st.length ? '<span style="'+st.join(';')+'">' : '<span>';
      }
      out += mkSpan();
      while (i < s.length) {
        var esc = s.indexOf('\x1b', i);
        if (esc < 0) { out += escHtml(s.substring(i)); break; }
        out += escHtml(s.substring(i, esc));
        var m = s.substring(esc).match(/^\x1b\[([0-9;:]*)m/);
        if (!m) { out += escHtml(s[esc]); i = esc + 1; continue; }
        var parts = m[1].split(';');
        for (var j = 0; j < parts.length; j++) {
          var sub = parts[j].split(':'), c = +sub[0];
          if (isNaN(c)) c = 0;
          if (c === 0) { fg = bg = null; bold = false; italic = false; ul = 0; }
          else if (c === 1) bold = true;
          else if (c === 3) italic = true;
          else if (c === 4) ul = sub.length > 1 ? +sub[1] : 1;
          else if (c === 22) bold = false;
          else if (c === 23) italic = false;
          else if (c === 24) ul = 0;
          else if (c >= 30 && c <= 37) fg = pal16[c - 30];
          else if (c === 38 && parts[j+1] === '5') { fg = palRgb(+parts[j+2]); j += 2; }
          else if (c === 38 && parts[j+1] === '2') { fg = 'rgb('+parts[j+2]+','+parts[j+3]+','+parts[j+4]+')'; j += 4; }
          else if (c === 39) fg = null;
          else if (c >= 40 && c <= 47) bg = pal16[c - 40];
          else if (c === 48 && parts[j+1] === '5') { bg = palRgb(+parts[j+2]); j += 2; }
          else if (c === 48 && parts[j+1] === '2') { bg = 'rgb('+parts[j+2]+','+parts[j+3]+','+parts[j+4]+')'; j += 4; }
          else if (c === 49) bg = null;
          else if (c >= 90 && c <= 97) fg = pal16[c - 82];
          else if (c >= 100 && c <= 107) bg = pal16[c - 92];
        }
        out += '</span>' + mkSpan();
        i = esc + m[0].length;
      }
      return out + '</span>';
    }

    function appendLine(text, color) {
      var p = document.createElement('p');
      if (color) {
        p.textContent = text;
        p.style.color = color;
      } else {
        p.innerHTML = ansi2html(text);
      }
      view.appendChild(p);
      trimScrollback();
      p.scrollIntoView();
    }

    function appendOutput(text) {
      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var part = lines[i];
        var hasMore = i < lines.length - 1;
        if (pending) {
          pending.innerHTML += ansi2html(part);
          if (hasMore) {
            pending.scrollIntoView();
            pending = null;
          }
        } else if (hasMore) {
          appendLine(part);
        } else if (part.length > 0) {
          pending = document.createElement('p');
          pending.innerHTML = ansi2html(part);
          view.appendChild(pending);
          pending.scrollIntoView();
        }
      }
    }

    function trimScrollback() {
      while (view.childNodes.length > 1000)
        view.removeChild(view.firstChild);
    }

    var src = new EventSource('/events');

    src.onmessage = function(e) {
      var c = e.data.charAt(0), s = e.data.substring(1);

      if (c >= 'A' && c <= 'Z') {
        if (c === 'I') {
          sid = s;
        } else if (c === 'E' || c === 'V') {
          window.open(s, '_blank');
        } else {
          console.error('unknown server command: ' + c);
        }
      } else if (c === '+') {
        if (!loggedIn) {
          loggedIn = true;
          login.style.display = 'none';
          main.style.display = '';
        }
        connected = true;
        inp.disabled = false;
        inp.focus();
      } else if (c === '-') {
        inp.disabled = true;
      } else if (c === '=') {
        /* status line (ignored for now) */
      } else if (c === '!') {
        if (!loggedIn) {
          loginError.textContent = s;
        } else {
          appendLine(s, 'red');
        }
      } else if (c === '^') {
        location.reload();
      } else if (c === '_') {
        console.log('tick', s);
      } else if (c >= '0' && c <= '9') {
        /* status line updates -- ignore for now */
      } else if (c >= 'a' && c <= 'z') {
        appendOutput(s);
      } else {
        appendOutput(e.data);
      }
    };

    src.onerror = function() {
      if (connected) {
        pending = null;
        appendLine('-- connection lost --', '#888');
        connected = false;
        inp.disabled = true;
      }
    };

    inp.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < 0) histIdx = cmdHist.length;
        if (histIdx > 0) inp.value = cmdHist[--histIdx];
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx >= 0 && histIdx < cmdHist.length - 1) {
          inp.value = cmdHist[++histIdx];
        } else {
          histIdx = -1;
          inp.value = '';
        }
      } else if (e.key === 'Enter') {
        var text = inp.value.trim();
        if (!text || !sid) return;
        cmdHist.push(text);
        if (cmdHist.length > 50) cmdHist.shift();
        histIdx = -1;
        inp.value = '';
        fetch('/cmd', { method: 'POST', body: sid + ' ' + text });
      }
    });

    document.getElementById('help-link').addEventListener('click', function(e) {
      e.preventDefault();
      appendLine('BorisMUD web client -- type commands at the prompt.', 'yellow');
    });
  </script>
</body>

</html>
