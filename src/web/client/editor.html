<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BorisMUD editor</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
<style>
body { background:#111; color:#ccc; font:14px monospace; margin:0; padding:8px;
  display:flex; flex-direction:column; height:100vh; box-sizing:border-box; }
#info { color:#888; margin-bottom:4px; }
#wrap { flex:1; position:relative; border:1px solid #333; }
#hl { position:absolute; top:0; left:0; right:0; bottom:0; margin:0;
  background:#000; color:#ccc; font:14px monospace; padding:8px;
  overflow:hidden; white-space:pre-wrap; word-wrap:break-word;
  pointer-events:none; box-sizing:border-box; }
#hl a { color:#5af; pointer-events:none; }
textarea { position:relative; width:100%; height:100%; background:transparent;
  color:transparent; caret-color:#0f0; border:none;
  font:14px monospace; resize:none; padding:8px; box-sizing:border-box; }
textarea::selection { background:rgba(51,153,255,0.4); }
textarea:read-only { color:#888; }
#view { flex:1; background:#000; color:#ccc; border:1px solid #333;
  font:14px monospace; padding:8px; overflow-y:auto; box-sizing:border-box;
  white-space:pre-wrap; word-wrap:break-word; display:none; }
#view a { color:#5af; }
#bar { margin-top:4px; display:flex; align-items:center; gap:8px; }
button { background:#333; color:#ccc; border:1px solid #555; font:inherit;
  padding:4px 12px; cursor:pointer; }
button:hover { background:#555; }
.ok { color:#0a0; } .err { color:#c00; }
</style>
</head>
<body>
<div id="info"></div>
<div id="wrap"><pre id="hl"></pre><textarea id="text" spellcheck="false"></textarea></div>
<div id="view"></div>
<div id="bar"></div>
<script>
var p = new URLSearchParams(location.search),
    obj = p.get('obj'), prop = p.get('prop'), sid = p.get('sid'),
    ro = location.pathname === '/view',
    ta = document.getElementById('text'),
    hl = document.getElementById('hl'),
    bar = document.getElementById('bar'),
    info = document.getElementById('info'),
    qs = 'obj=' + encodeURIComponent(obj) + '&prop=' + encodeURIComponent(prop) + '&sid=' + encodeURIComponent(sid);

var view = document.getElementById('view');

document.title = (ro ? 'View' : 'Edit') + ' ' + obj + '.' + prop + ' - BorisMUD';
info.textContent = (ro ? 'Viewing' : 'Editing') + ' ' + obj + '.' + prop;

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMd(text) {
  return text.split('\n').map(function(line) {
    var h = escHtml(line);
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">[$1]($2)</a>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>**$1**</b>');
    h = h.replace(/\b_([^_]+)_\b/g, '<i>_$1_</i>');
    h = h.replace(/`([^`]+)`/g, '<span style="color:#fa0">`$1`</span>');
    var hm = line.match(/^(#{1,6})\s/);
    if (hm) {
      var sz = [0,2,1.6,1.3,1.1,1,0.9][hm[1].length];
      return '<span style="color:#0f0;font-size:'+sz+'em">'+h+'</span>';
    }
    return h;
  }).join('\n');
}

function updateHl() { hl.innerHTML = renderMd(ta.value) + '\n'; }
function syncScroll() { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; }
if (!ro) {
  ta.addEventListener('input', updateHl);
  ta.addEventListener('scroll', syncScroll);
}

fetch('/prop?' + qs).then(function(r) {
  if (!r.ok) return r.text().then(function(t) { throw t; });
  return r.text();
}).then(function(t) {
  if (ro) {
    document.getElementById('wrap').style.display = 'none';
    view.style.display = 'block';
    view.innerHTML = renderMd(t);
  } else {
    ta.value = t;
    updateHl();
    ta.focus();
  }
}).catch(function(e) { ta.value = 'Error: ' + e; ta.readOnly = true; });

if (!ro) {
  var btn = document.createElement('button');
  btn.textContent = 'Save';
  var msg = document.createElement('span');
  bar.appendChild(btn); bar.appendChild(msg);
  btn.onclick = function() {
    msg.className = ''; msg.textContent = 'Saving...';
    fetch('/prop?' + qs, {method:'POST', body:ta.value}).then(function(r) {
      if (r.ok) { msg.className = 'ok'; msg.textContent = 'Saved.'; }
      else r.text().then(function(t) { msg.className = 'err'; msg.textContent = t; });
    });
  };
  ta.onkeydown = function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); btn.click(); }
  };
}

if (ro) {
  var editBtn = document.createElement('button');
  editBtn.textContent = 'Edit';
  editBtn.onclick = function() { location.href = '/edit?' + qs; };
  bar.appendChild(editBtn);
}
</script>
</body>
</html>
